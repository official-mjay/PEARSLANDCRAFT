<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/jpeg" href="assets/Logo.jpg?v=2"><title>Shop — Pearls & Crafts</title><link rel="stylesheet" href="styles.css"></head><body><div id="header"></div><main><section class="page-hero"><div class="container"><div class="eyebrow">THE COLLECTION</div><h1>Beautiful tools for intentional living.</h1><div class="script">Choose something meaningful.</div><p>Explore journals, planners and faith-inspired pieces created with purpose.</p></div></section><section class="section"><div class="container"><div class="shop-toolbar"><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="journals">Journals</button><button class="filter" data-filter="clothing">Clothing</button></div><select id="sort"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></div><div class="product-grid" id="shop-grid"></div></div></section></main><div id="footer"></div><script src="app.js"></script><script>Promise.all([fetch('header.html').then(r=>r.text()),fetch('footer.html').then(r=>r.text())]).then(([h,f])=>{header.innerHTML=h;footer.innerHTML=f;updateCartBadge();const filter=new URLSearchParams(location.search).get('filter')||'all';renderShop(filter)});document.addEventListener('change',e=>{if(e.target.id==='sort'){let a=[...products];const f=new URLSearchParams(location.search).get('filter')||'all';if(f!=='all')a=a.filter(p=>p.category===f);if(e.target.value==='low')a.sort((x,y)=>x.price-y.price);if(e.target.value==='high')a.sort((x,y)=>y.price-x.price);renderProducts(a,document.querySelector('#shop-grid'))}})</script></body></html>
